# adapted from https://github.com/xlsynth/xlsynth-crate/blob/main/.github/workflows/ci.yml

name: Rust CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # -----------------------------------------------------------
  # 1) Lint-check / pre-commit gate
  # -----------------------------------------------------------
  lint-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.85.0
          components: rustfmt

      - name: Set up Python + pre-commit
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt

      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: |
          pre-commit install
          pre-commit run --all-files

  # -----------------------------------------------------------
  # 2) Build/test
  # -----------------------------------------------------------
  build-and-test:
    needs: [lint-check]  # Ensure lint checks pass first
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]  # TODO: add macOS CI coverage.
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure Cargo target
        # Keep CMake's downloaded native sources outside the checkout.
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/slang-rs-target" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.85.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Verify native build prerequisites
        run: |
          cmake --version
          python3 --version
          c++ --version

      - name: Test native installation and archive handling
        run: python3 -B tools/test_native.py

      - name: Run tests
        run: cargo test --locked

      - name: Verify documentation
        run: cargo doc --locked --no-deps

      - name: Verify packaged crate
        run: cargo package --locked
