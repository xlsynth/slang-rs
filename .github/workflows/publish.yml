# adapted from https://github.com/xlsynth/xlsynth-crate/blob/main/.github/workflows/publish.yml

name: Release slang-rs

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: Deploy

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Configure Cargo target
      # Keep CMake's downloaded native sources outside the checkout.
      shell: bash
      run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/slang-rs-target" >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'

    - name: Validate version
      run: |
        python check_version_is.py "$GITHUB_REF_NAME"

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      with:
        toolchain: 1.85.0

    - name: Cache Cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache Cargo index
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-

    - name: Build and test
      run: cargo test --locked

    - name: Authenticate with crates.io
      id: auth
      uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

    - name: Publish slang-rs to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        cargo publish --locked

  # Other CI jobs on matching platform(s) can use these bundles to skip compiling
  # Slang and fmt. Only this job needs permission to create GitHub releases.
  native-release:
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      with:
        toolchain: 1.85.0

    - name: Build the native bundle
      env:
        CC: gcc
        CXX: g++
      run: |
        python3 tools/native.py build \
          --build-dir "$RUNNER_TEMP/slang-native-build" \
          --output "$RUNNER_TEMP/slang-native-stage"
        python3 tools/native.py archive \
          --from "$RUNNER_TEMP/slang-native-stage" \
          --output "$RUNNER_TEMP/slang-native-ubuntu-24.04-x86_64-gnu.tar.gz"

    - name: Verify the relocated archive with Cargo
      env:
        CC: gcc
        CXX: g++
        CARGO_TARGET_DIR: ${{ runner.temp }}/slang-native-consumer-target
      run: |
        cd "$RUNNER_TEMP"
        sha256sum --check slang-native-ubuntu-24.04-x86_64-gnu.tar.gz.sha256
        mkdir slang-native-extracted
        tar -xzf slang-native-ubuntu-24.04-x86_64-gnu.tar.gz -C slang-native-extracted
        cd "$GITHUB_WORKSPACE"
        SLANG_RS_NATIVE_DIR="$RUNNER_TEMP/slang-native-extracted" \
          cargo test --locked --test native_test \
          native_queries_reuse_session_without_external_tools -- --exact

    - name: Attach archive to the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        archive="$RUNNER_TEMP/slang-native-ubuntu-24.04-x86_64-gnu.tar.gz"
        if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" "$archive" "$archive.sha256"
        else
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag \
            "$archive" "$archive.sha256"
        fi
